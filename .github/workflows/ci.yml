name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Check, Clippy & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v15
        with:
          name: nix-community
          skipPush: true

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: nix develop --command cargo fmt --check

      - name: Check (No Warnings)
        run: nix develop --command env RUSTFLAGS=-D warnings cargo check --all-targets --all-features

      - name: Build Dioxus web app
        run: nix develop --command dx build --web --package keepbook-dioxus --release --debug-symbols false

      - name: Clippy
        run: nix develop --command cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: nix develop --command cargo build --all-targets

      - name: Test
        run: nix develop --command cargo test --all-targets --all-features

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v15
        with:
          name: nix-community
          skipPush: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-dioxus-android-gradle-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-dioxus-android-gradle-

      - name: Build Android debug APK
        run: nix run .#dioxus-android-debug

      - name: Collect Android debug APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ci-artifacts/android
          mapfile -t apks < <(
            find target/dx/keepbook-dioxus/debug/android \
              -path '*/build/outputs/apk/debug/*.apk' \
              -type f \
              | sort
          )

          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No Android debug APK was produced" >&2
            exit 1
          fi

          for apk in "${apks[@]}"; do
            cp -v "$apk" "ci-artifacts/android/keepbook-dioxus-android-debug-$(basename "$apk")"
          done

          ls -lh ci-artifacts/android

      - name: Save Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: keepbook-dioxus-android-debug
          path: ci-artifacts/android/*
          if-no-files-found: error
          retention-days: 14
